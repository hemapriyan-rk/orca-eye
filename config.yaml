# =============================================================================
# ORCA EYE — Master Configuration
# RESEARCH PROTOTYPE — NOT FOR REAL-WORLD MOBILITY USE
# =============================================================================
# All tunable parameters are defined here.
# Do NOT hard-code numeric values in source modules.
# =============================================================================

# -----------------------------------------------------------------------------
# Camera / Video Source
# -----------------------------------------------------------------------------
camera:
  # Test video file:  "D:/orca/videos/WhatsApp Video 2026-09-16 at 7.37.26 PM.mp4"
  # Wi-Fi IP Webcam:  "http://10.234.182.115:8080/video"
  # Local webcam:     0
  source: "D:/orca/videos/WhatsApp Video 2026-09-16 at 7.37.26 PM.mp4"
  width: 640
  height: 480
  fps_target: 30
  reconnect_attempts: 5
  reconnect_delay_s: 1.0

# -----------------------------------------------------------------------------
# YOLO Object Detection
# -----------------------------------------------------------------------------
detection:
  # OIV7 model has 601 classes including Wall, Waste container (dustbin),
  # Door, Stairs, Handrail — critical for navigation obstacle detection.
  model: "yolov8n-oiv7.pt"
  # TensorRT engine (auto-exported on first run for 3-4x speedup).
  # Delete .engine file to force re-export (e.g. after changing imgsz).
  engine_path: "yolov8n-oiv7.engine"
  use_tensorrt: false         # set true only if tensorrt pip package is installed
  confidence_threshold: 0.35
  nms_threshold: 0.45
  device: "cuda"
  half: true                  # FP16 — ~2x throughput on RTX
  imgsz: 320                  # 320px: ~4x faster than 640, sufficient for navigation
  torch_compile: false
  # OIV7 class IDs — verified at runtime from model.names.
  # null = detect all 601 classes (slower); list = filtered (fast).
  # IDs below are approximate; loader resolves exact IDs from model.names at startup.
  target_classes: null        # null = auto-resolve navigation classes from model.names
  # Navigation-relevant OIV7 class name substrings (used when target_classes is null)
  nav_class_names:
    - "person"
    - "wall"
    - "waste container"
    - "door"
    - "stairs"
    - "handrail"
    - "chair"
    - "bench"
    - "bicycle"
    - "car"
    - "truck"
    - "dining table"
    - "potted plant"
    - "trash can"
    - "garbage bin"
    - "waste bin"
    - "barrel"
    - "column"
    - "pillar"
    - "fence"
    - "barrier"
    - "cabinetry"
    - "cart"
  low_confidence_threshold: 0.25
  # Class-specific confidence thresholds (resolved at runtime by class name)
  class_conf_by_name:
    person: 0.38
    wall: 0.30          # lower thresh — walls are safety-critical
    waste container: 0.30
    door: 0.32
    stairs: 0.32
    car: 0.42
  # Box size bounds
  min_box_dim: 12
  max_box_dim: 640
  # Temporal confirmation
  confirmation_frames: 1      # 1 = disabled (fastest); 2 = safer
  persistence_frames: 3
  duplicate_iou_threshold: 0.70

# -----------------------------------------------------------------------------
# Temporal Tracking
# -----------------------------------------------------------------------------
tracking:
  max_disappeared: 10         # frames before a track is dropped
  max_distance: 150           # max pixel distance for centroid matching
  iou_weight: 0.6             # weight of IoU vs centroid distance in matching
  centroid_weight: 0.4
  velocity_alpha: 0.3         # EMA alpha for velocity smoothing
  min_track_age: 2            # frames before a track is considered stable
  # Phase 1: Advanced tracking & motion classification
  history_window: 5           # frames for smoothed velocity regression
  stationary_velocity_thresh: 1.5   # px/frame below which object is stationary
  approaching_area_rate_thresh: 0.04 # relative area expansion rate for approaching objects
  crossing_ratio_thresh: 2.0  # |vx| / |vy| ratio to classify as laterally crossing

# -----------------------------------------------------------------------------
# Monocular Depth Estimation
# -----------------------------------------------------------------------------
depth:
  model: "MiDaS_small"
  input_size: 256             # reduced from 384 — faster, sufficient for nav
  device: "cuda"
  half: true
  normalize: true
  enabled: true
  skip_frames: 4              # run MiDaS every 4th frame (~7.5Hz depth, 30Hz detection)
                              # IMPORTANT: pipeline now enforces this — saves ~14ms/frame
  # Phase 1: Object ROI robust depth extraction
  roi_inner_ratio: 0.60
  outlier_percentile_low: 10
  outlier_percentile_high: 90

# -----------------------------------------------------------------------------
# Free-Space Estimation (Hybrid Option C)
# -----------------------------------------------------------------------------
freespace:
  walkable_bottom_fraction: 0.55
  obstacle_inflation: 1.05
  depth_gradient_threshold: 0.08
  near_depth_threshold: 0.20
  free_probability_threshold: 0.45
  labels:
    FREE: 0
    OBSTACLE: 1
    UNKNOWN: 2
  # Depth-based large static obstacle heuristic (fallback for unclassified walls/bins)
  # Runs GPU-side via morphological ops — no CPU transfer until final label map.
  wall_detection:
    enabled: true
    near_depth_wall_thresh: 0.25   # depth < this = "near" candidate (was 0.35, too aggressive)
    min_wall_region_frac: 0.12     # region must cover > 12% of frame (was 0.04, too sensitive)
    max_wall_gradient: 0.03        # low gradient = flat/uniform = likely wall

# -----------------------------------------------------------------------------
# Spatial Navigation Map
# -----------------------------------------------------------------------------
spatial_map:
  grid_rows: 12
  grid_cols: 20
  occupancy_decay: 0.85
  uncertainty_growth: 0.05
  # Temporal ring buffer: fuse last N free-space maps.
  # temporal max-pool reduces flicker; higher = more stable but slower to react.
  temporal_window: 5

# -----------------------------------------------------------------------------
# Candidate Path Generation
# -----------------------------------------------------------------------------
path_generation:
  # A* 3D voxel pathfinding (row × col × depth_band grid)
  # Replaces fixed arc sampling with optimal graph search.
  use_astar: true
  # Depth bands: thresholds for VERY_NEAR / NEAR / MID / FAR classification
  depth_band_thresholds: [0.25, 0.45, 0.70]   # 4 bands: <0.25, <0.45, <0.70, >=0.70
  # A* node cost weights
  astar_w_occ: 3.0       # penalty for occupied cells
  astar_w_depth: 2.0     # penalty for near-depth cells
  astar_w_unc: 0.5       # penalty for uncertain cells
  astar_w_curv: 0.3      # curvature penalty (prefer straight)
  # Candidate goal columns (one A* search per goal = one PathCandidate)
  candidate_angles_deg:
    - -30.0
    - -15.0
    -  0.0
    - 15.0
    - 30.0
  path_depth: 8          # max A* search depth in rows
  min_corridor_width: 2
  include_stop: true

# -----------------------------------------------------------------------------
# Path Scoring Weights
# Score(P) = w_c*C + w_f*F + w_p*P + w_depth*D - w_r*R - w_u*U - w_d*DC
# -----------------------------------------------------------------------------
scoring:
  w_c: 0.28      # clearance weight
  w_f: 0.22      # free-space weight
  w_p: 0.22      # forward-progress weight
  w_r: 0.15      # collision-risk penalty weight
  w_u: 0.05      # uncertainty penalty weight
  w_d: 0.18      # dynamic-object conflict penalty weight
  w_depth: 0.15  # depth clearance reward (3D — far cells preferred)
  stop_base_score: 0.10

# -----------------------------------------------------------------------------
# Dynamic Object Conflict Reasoning (Phase 1)
# -----------------------------------------------------------------------------
dynamic_conflict:
  enabled: true
  time_horizon_s: 2.5         # seconds to project dynamic object forward
  conflict_distance_threshold: 45.0  # pixels distance to flag corridor conflict
  min_conflict_confidence: 0.40      # minimum tracking/motion confidence required

# -----------------------------------------------------------------------------
# Safety & Decision Thresholds
# -----------------------------------------------------------------------------
safety:
  # Minimum score for a path to be considered GO (else STOP)
  min_go_score: 0.35
  # Minimum clearance (fraction of path width) to allow GO
  min_clearance: 0.20
  # Max uncertainty fraction before issuing CAUTION
  max_uncertainty: 0.65
  # Hysteresis: current path must be beaten by this margin to switch directions
  direction_hysteresis: 0.08
  # Stability window: frames used to detect oscillation
  stability_window: 10
  # Max direction changes per stability_window before flagging oscillation
  max_direction_changes: 4

# -----------------------------------------------------------------------------
# Navigation Commands
# -----------------------------------------------------------------------------
commands:
  - LEFT
  - SLIGHT_LEFT
  - STRAIGHT
  - SLIGHT_RIGHT
  - RIGHT
  - STOP
  - CAUTION

# -----------------------------------------------------------------------------
# Visualization
# -----------------------------------------------------------------------------
visualization:
  window_name: "ORCA EYE - Research Prototype"
  layout: "auto"              # "auto" (1x4 for portrait, 2x2 for landscape), "horizontal", or "grid"
  show_depth: true
  show_freespace: true
  show_grid: true
  show_paths: true
  show_metrics: true
  # Colors (BGR)
  colors:
    free: [0, 200, 0]
    obstacle: [0, 0, 220]
    unknown: [0, 165, 255]
    selected_path: [0, 255, 255]
    candidate_path: [100, 100, 100]
    bbox: [0, 255, 0]
    track_id: [255, 165, 0]
    warning: [0, 0, 255]
    caution: [0, 165, 255]
    safe: [0, 200, 0]
  # Overlay alpha for free-space mask
  freespace_alpha: 0.40
  grid_alpha: 0.30
  font_scale: 0.55
  fps_display: true
  tts_enabled: false          # set true to enable pyttsx3 audio

# -----------------------------------------------------------------------------
# Audio Instruction Generation (Phase 1)
# -----------------------------------------------------------------------------
audio:
  enabled: false              # set true to enable pyttsx3 speech
  cooldown_seconds: 2.5       # min seconds between non-emergency instructions
  reminder_seconds: 8.0       # repeat current recommendation if unchanged
  speech_rate: 155            # words per minute

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  log_dir: "logs"
  failure_dir: "failure_cases"
  per_frame_jsonl: true
  metrics_csv: true
  save_frames: false          # save every frame as JPEG (disk-heavy; off by default)
  flush_interval: 50          # flush log buffer every N frames
  max_log_size_mb: 500        # rotate log after this size

# -----------------------------------------------------------------------------
# Failure Detection Thresholds
# -----------------------------------------------------------------------------
failure_detection:
  # Low clearance threshold (fraction)
  low_clearance_threshold: 0.15
  # Low confidence threshold for detection reliability
  low_detection_confidence: 0.30
  # High uncertainty threshold for free-space instability
  high_uncertainty_threshold: 0.60
  # Depth inconsistency: max frame-to-frame normalized depth change
  depth_inconsistency_threshold: 0.25
  # Rapid path change: direction changes within this many frames
  rapid_change_window: 5
  # Unknown region dominance threshold (fraction of grid cells)
  unknown_dominance_threshold: 0.55
  # Save JPEG snapshot of flagged frames
  save_snapshots: true

# -----------------------------------------------------------------------------
# Performance Profiling
# -----------------------------------------------------------------------------
performance:
  profile_enabled: true
  # Log GPU/CPU/RAM stats every N frames
  resource_log_interval: 30
  # PyTorch global settings
  cudnn_benchmark: true       # auto-tune conv kernels for fixed input sizes
  cudnn_deterministic: false  # allow non-deterministic ops for speed

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  scenarios_dir: "data/scenarios"
  results_dir: "logs/scenarios"
  # Ground-truth annotation format (future; placeholder)
  gt_format: "none"
